<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>A Special Surprise For You! 🎁</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Canvas Confetti for celebratory burst -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
      background: radial-gradient(circle at 50% 20%, #2e0854, #120424, #080112);
      min-height: 100vh;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .font-serif-title {
      font-family: 'Playfair Display', serif;
    }

    /* Ambient floating glowing orbs */
    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.45;
      pointer-events: none;
      animation: floatSlow 8s ease-in-out infinite alternate;
    }

    @keyframes floatSlow {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-25px) scale(1.1); }
    }

    /* 3D Gift Box Construction */
    .gift-stage {
      perspective: 1000px;
    }

    .gift-container {
      position: relative;
      width: 190px;
      height: 190px;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
    }

    @media (min-width: 640px) {
      .gift-container {
        width: 230px;
        height: 230px;
      }
    }

    /* Gentle idling hover effect */
    .gift-container.idle {
      animation: gentleFloat 3.5s ease-in-out infinite;
    }

    @keyframes gentleFloat {
      0%, 100% {
        transform: translateY(0) rotateX(10deg) rotateY(-12deg);
      }
      50% {
        transform: translateY(-16px) rotateX(14deg) rotateY(12deg);
      }
    }

    /* Box Base and Lid */
    .box-body {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 78%;
      background: linear-gradient(135deg, #e11d48, #be123c, #881337);
      border-radius: 18px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7),
                  0 0 35px rgba(225, 29, 72, 0.4),
                  inset 0 2px 4px rgba(255, 255, 255, 0.3);
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* Golden ribbons */
    .box-ribbon-v {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 44px;
      background: linear-gradient(90deg, #f59e0b, #fef08a 45%, #eab308 60%, #b45309);
      box-shadow: 0 0 12px rgba(253, 224, 71, 0.4);
    }

    .box-ribbon-h {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      transform: translateY(-50%);
      height: 44px;
      background: linear-gradient(180deg, #f59e0b, #fef08a 45%, #eab308 60%, #b45309);
      box-shadow: 0 0 12px rgba(253, 224, 71, 0.4);
    }

    /* Box Lid */
    .box-lid {
      position: absolute;
      top: 4px;
      left: -6%;
      width: 112%;
      height: 38px;
      background: linear-gradient(135deg, #f43f5e, #e11d48, #9f1239);
      border-radius: 14px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4),
                  inset 0 2px 4px rgba(255, 255, 255, 0.4);
      z-index: 10;
      transform-origin: top center;
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.7s;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .box-lid .box-ribbon-v {
      width: 48px;
    }

    /* Bow on top */
    .bow-wrap {
      position: absolute;
      top: -26px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 12;
      transition: transform 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.6s;
    }

    .bow-knot {
      width: 32px;
      height: 32px;
      background: radial-gradient(circle at 35% 35%, #fef08a, #eab308, #b45309);
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }

    .bow-loop-left, .bow-loop-right {
      position: absolute;
      top: -6px;
      width: 42px;
      height: 32px;
      border: 7px solid #fbbf24;
      background: radial-gradient(circle at 40% 40%, rgba(254, 240, 138, 0.8), rgba(202, 138, 4, 0.9));
      box-shadow: 0 4px 12px rgba(251, 191, 36, 0.4);
    }

    .bow-loop-left {
      left: -28px;
      border-radius: 50% 15% 15% 50%;
      transform: rotate(-22deg);
    }

    .bow-loop-right {
      right: -28px;
      border-radius: 15% 50% 50% 15%;
      transform: rotate(22deg);
    }

    /* Opening sequence animation classes */
    .gift-container.opened .box-lid {
      transform: translateY(-130px) rotateX(110deg) rotateZ(-18deg) scale(0.9);
      opacity: 0;
    }

    .gift-container.opened .bow-wrap {
      transform: translateX(-50%) translateY(-150px) scale(0.5) rotate(45deg);
      opacity: 0;
    }

    .gift-container.opened .box-body {
      transform: scale(0.9) translateY(40px);
      opacity: 0;
      transition: all 0.7s cubic-bezier(0.4, 0, 0.2, 1) 0.15s;
    }

    /* Background shimmer */
    .shimmer-text {
      background: linear-gradient(90deg, #fef08a 0%, #fff 50%, #fef08a 100%);
      background-size: 200% auto;
      color: transparent;
      -webkit-background-clip: text;
      animation: shine 3s linear infinite;
    }

    @keyframes shine {
      to { background-position: 200% center; }
    }
  </style>
</head>

<body class="relative flex flex-col items-center justify-center min-h-screen text-white overflow-hidden p-4 sm:p-6">

  <!-- Glowing background elements -->
  <div class="glow-orb w-80 h-80 -top-16 -left-16 bg-pink-600"></div>
  <div class="glow-orb w-96 h-96 -bottom-20 -right-20 bg-amber-500"></div>
  <div class="glow-orb w-72 h-72 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-purple-600 opacity-30"></div>

  <!-- Sparkle Particle Canvas -->
  <canvas id="sparkleCanvas" class="absolute inset-0 pointer-events-none z-0"></canvas>

  <!-- ================= MAIN GIFT HERO WRAPPER ================= -->
  <main id="giftSection" class="relative z-10 flex flex-col items-center justify-center text-center transition-all duration-700 max-w-lg w-full">
    
    <!-- Header tags -->
    <div class="mb-4 inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/10 backdrop-blur-md border border-white/15 text-xs sm:text-sm font-semibold tracking-wide text-amber-300 shadow-lg">
      <span class="animate-pulse">✨</span> Surprise Waiting Inside
    </div>

    <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight font-serif-title text-white mb-2 leading-tight">
      Someone Sent You A <span class="shimmer-text">Gift</span>!
    </h1>

    <p class="text-white/70 text-sm sm:text-base max-w-sm mb-8 px-2 font-normal leading-relaxed">
      Turn up your volume and tap the gift box to reveal your celebration surprise!
    </p>

    <!-- Interactive Gift Box Stage -->
    <div class="gift-stage my-2 p-4">
      <div id="giftBox" class="gift-container idle" role="button" aria-label="Open your surprise gift" tabindex="0">
        
        <!-- Bow on top -->
        <div class="bow-wrap">
          <div class="bow-loop-left"></div>
          <div class="bow-loop-right"></div>
          <div class="bow-knot"></div>
        </div>

        <!-- Lid -->
        <div class="box-lid">
          <div class="box-ribbon-v"></div>
        </div>

        <!-- Main Box Body -->
        <div class="box-body">
          <div class="box-ribbon-v"></div>
          <div class="box-ribbon-h"></div>
        </div>

      </div>
    </div>

    <!-- Action Button -->
    <div class="mt-8 flex flex-col items-center gap-3">
      <button id="openGiftBtn" class="group relative px-8 py-3.5 rounded-full text-base sm:text-lg font-bold text-gray-900 bg-gradient-to-r from-amber-300 via-yellow-400 to-amber-500 hover:from-amber-200 hover:to-yellow-400 shadow-[0_0_30px_rgba(251,191,36,0.5)] hover:shadow-[0_0_40px_rgba(251,191,36,0.8)] active:scale-95 transition-all duration-200 flex items-center gap-2.5">
        <span>Tap to Open Your Gift</span>
        <span class="text-xl group-hover:rotate-12 transition-transform duration-200">🎁</span>
      </button>

      <p class="text-xs text-white/50 tracking-wide">Works seamlessly on mobile & laptop</p>
    </div>

  </main>

  <!-- ================= REVEALED VIDEO MODAL / CONTAINER ================= -->
  <section id="videoRevealSection" class="fixed inset-0 z-50 flex flex-col items-center justify-center p-3 sm:p-6 bg-black/95 backdrop-blur-2xl opacity-0 pointer-events-none transition-all duration-700 transform scale-95" aria-modal="true" role="dialog">
    
    <!-- Top Bar Controls -->
    <div class="w-full max-w-4xl flex items-center justify-between mb-3 text-white px-2">
      <div class="flex items-center gap-2">
        <span class="flex h-3 w-3 relative">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-3 w-3 bg-rose-500"></span>
        </span>
        <span class="text-xs sm:text-sm font-semibold tracking-wider text-rose-300 uppercase">Now Playing Your Surprise</span>
      </div>

      <div class="flex items-center gap-2">
        <!-- Replay button -->
        <button id="replayBtn" title="Replay from start" class="px-3.5 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 border border-white/20 text-xs sm:text-sm font-medium flex items-center gap-1.5 transition active:scale-95">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
          <span>Replay</span>
        </button>

        <!-- Close / Back to Gift button -->
        <button id="closeVideoBtn" title="Back to gift" class="p-2 rounded-lg bg-white/10 hover:bg-red-500/30 hover:border-red-400 border border-white/20 text-white transition active:scale-95">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
    </div>

    <!-- Responsive Video Player Frame (16:9 Aspect Ratio) -->
    <div class="w-full max-w-4xl relative rounded-2xl overflow-hidden shadow-2xl border border-white/10 bg-black aspect-video flex items-center justify-center">
      <!-- YouTube IFrame API Target Element -->
      <div id="youtubePlayer" class="w-full h-full"></div>
    </div>

    <!-- Bottom encouragement -->
    <p class="mt-4 text-xs sm:text-sm text-white/60 text-center font-medium">
      Hope you loved this surprise! Enjoy the music and moment ✨
    </p>

  </section>

  <script>
    /* Sparkle Ambient Particle Animation */
    const canvas = document.getElementById('sparkleCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2.2 + 0.5;
        this.alpha = Math.random() * 0.7 + 0.2;
        this.speedX = (Math.random() - 0.5) * 0.35;
        this.speedY = -Math.random() * 0.45 - 0.15;
        this.color = Math.random() > 0.4 ? '#fbbf24' : '#ec4899';
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.y < -10 || this.x < -10 || this.x > canvas.width + 10) {
          this.reset();
          this.y = canvas.height + 10;
        }
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    const PARTICLE_COUNT = Math.min(65, Math.floor(window.innerWidth / 15));
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      particles.push(new Particle());
    }

    function animateSparkles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateSparkles);
    }
    animateSparkles();

    /* YouTube IFrame API Integration */
    const VIDEO_ID = '6-8E4Nirh9s';
    let ytPlayer = null;
    let isPlayerReady = false;

    // Load official YouTube IFrame Player API
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    // YouTube API callback once script loads
    window.onYouTubeIframeAPIReady = function() {
      ytPlayer = new YT.Player('youtubePlayer', {
        height: '100%',
        width: '100%',
        videoId: VIDEO_ID,
        playerVars: {
          autoplay: 0,
          playsinline: 1,      // Essential for playing directly on iOS / Android browsers
          controls: 1,         // Allows user full playback control
          rel: 0,              // Minimize unrelated recommendations
          modestbranding: 1,
          enablejsapi: 1
        },
        events: {
          onReady: onPlayerReady
        }
      });
    };

    function onPlayerReady() {
      isPlayerReady = true;
    }

    /* Elements */
    const giftBox = document.getElementById('giftBox');
    const openGiftBtn = document.getElementById('openGiftBtn');
    const giftSection = document.getElementById('giftSection');
    const videoSection = document.getElementById('videoRevealSection');
    const replayBtn = document.getElementById('replayBtn');
    const closeVideoBtn = document.getElementById('closeVideoBtn');

    let isGiftOpened = false;

    // Trigger explosive confetti celebration
    function fireConfettiBurst() {
      const count = 220;
      const defaults = {
        origin: { y: 0.65 },
        zIndex: 9999
      };

      function fire(particleRatio, opts) {
        confetti(Object.assign({}, defaults, opts, {
          particleCount: Math.floor(count * particleRatio)
        }));
      }

      fire(0.25, {
        spread: 26,
        startVelocity: 55,
        colors: ['#f59e0b', '#ec4899', '#f43f5e']
      });
      fire(0.2, {
        spread: 60,
        colors: ['#3b82f6', '#10b981', '#fef08a']
      });
      fire(0.35, {
        spread: 100,
        decay: 0.91,
        scalar: 0.8
      });
      fire(0.1, {
        spread: 120,
        startVelocity: 25,
        decay: 0.92,
        colors: ['#ffffff', '#fbbf24']
      });
      fire(0.1, {
        spread: 120,
        startVelocity: 45,
      });
    }

    // Unbox logic triggered by direct user gesture (enables unmuted sound on mobile/laptop)
    function openGift() {
      if (isGiftOpened) return;
      isGiftOpened = true;

      // Stop gentle idling and start lid lift animation
      giftBox.classList.remove('idle');
      giftBox.classList.add('opened');

      // Shoot festive confetti
      fireConfettiBurst();

      // Begin playback right inside the user tap event handler for autoplay compliance
      if (isPlayerReady && ytPlayer && typeof ytPlayer.playVideo === 'function') {
        try {
          ytPlayer.unMute();
          ytPlayer.seekTo(0, true);
          ytPlayer.playVideo();
        } catch (err) {
          console.log('Autoplay playback initiated');
        }
      }

      // Smoothly hide gift intro and bring in the video overlay
      setTimeout(() => {
        giftSection.classList.add('opacity-0', 'scale-90', 'pointer-events-none');
        
        setTimeout(() => {
          giftSection.classList.add('hidden');
          videoSection.classList.remove('opacity-0', 'pointer-events-none', 'scale-95');
          videoSection.classList.add('opacity-100', 'scale-100');

          // Ensure video continues playing if delayed load
          if (isPlayerReady && ytPlayer && typeof ytPlayer.playVideo === 'function') {
            ytPlayer.playVideo();
          }
        }, 400);

      }, 700);
    }

    // Attach click & keydown handlers
    giftBox.addEventListener('click', openGift);
    openGiftBtn.addEventListener('click', openGift);

    giftBox.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        openGift();
      }
    });

    // Replay button handler
    replayBtn.addEventListener('click', () => {
      if (ytPlayer && typeof ytPlayer.seekTo === 'function') {
        ytPlayer.seekTo(0, true);
        ytPlayer.playVideo();
        fireConfettiBurst();
      }
    });

    // Close video / Reset back to gift view
    closeVideoBtn.addEventListener('click', () => {
      if (ytPlayer && typeof ytPlayer.pauseVideo === 'function') {
        ytPlayer.pauseVideo();
      }

      videoSection.classList.remove('opacity-100', 'scale-100');
      videoSection.classList.add('opacity-0', 'pointer-events-none', 'scale-95');

      setTimeout(() => {
        giftSection.classList.remove('hidden');
        setTimeout(() => {
          giftBox.classList.remove('opened');
          giftBox.classList.add('idle');
          giftSection.classList.remove('opacity-0', 'scale-90', 'pointer-events-none');
          isGiftOpened = false;
        }, 50);
      }, 400);
    });
  </script>
</body>
</html>
